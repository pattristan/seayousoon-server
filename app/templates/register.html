{% extends "base.html" %}
{% block content %}
<h1>Register</h1>
<p class="lede">Your details stay private. Family can only follow you with a code you
create and send them yourself — no crew ID needed, ever.</p>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/register">
    <label>Your name
        <input name="name" placeholder="Jojo" required>
    </label>
    <label>Choose a username
        <input name="username" placeholder="e.g. patrick.sol" autocapitalize="off" required
               pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,19}">
    </label>
    <label>Ship
        <select name="ship" required>
            {% for ship in ships %}<option value="{{ ship }}">{{ ship }}</option>{% endfor %}
        </select>
    </label>
    <label>Embarkation date
        <input name="embark_date" type="date" required>
    </label>
    <label>Disembarkation date
        <input name="disembark_date" type="date" required>
    </label>
    <label>Choose a PIN (4+ digits)
        <input name="pin" type="password" inputmode="numeric" minlength="4" required>
    </label>
    <button type="submit">Create account</button>
</form>

<p class="alt">Already registered? <a href="/">Log in</a></p>
{% endblock %}
